  <style>

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background: #0a0a0d;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-x: none !important;
      overscroll-behavior-y: none !important;
      overscroll-behavior: none !important;
      touch-action: none !important;
      -ms-touch-action: none !important;
    }

    #webglCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Minimalist Top HUD Bar Only */
    .hud-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(16px, 2.5vw, 28px);
      z-index: 20;
      pointer-events: none;
    }

    .hud-brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: auto;
    }

    .hud-logo {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #ffffff;
      text-decoration: none;
    }

    .hud-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ff1c1c;
      font-weight: 700;
    }

    .hud-nav-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn-hud {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 9px 18px;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-hud:hover {
      background: #ff1c1c;
      border-color: #ff1c1c;
      transform: translateY(-1px);
    }

    /* Clean Subtle Hotspot Beacons on Clothes */
    .spotlight-beacon {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: auto;
    }

    .spotlight-beacon-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: beaconPulse 2s infinite ease-out;
    }

    @keyframes beaconPulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .spotlight-beacon-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
      position: relative;
      transition: transform 0.2s;
    }

    .spotlight-beacon:hover .spotlight-beacon-dot {
      background: #ff1c1c;
      box-shadow: 0 0 15px #ff1c1c;
      transform: scale(1.35);
    }

    .spotlight-tag-label {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      display: flex;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    /* Slide-in Product Drawer */
    .product-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: clamp(340px, 28vw, 440px);
      height: 100vh;
      background: #111114;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: -10px 0 50px rgba(0, 0, 0, 0.8);
      z-index: 50;
      transform: translateX(105%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      color: #ffffff;
    }

    .product-drawer.open {
      transform: translateX(0);
    }

    .drawer-close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .drawer-close-btn:hover {
      background: #ff1c1c;
      border-color: #ff1c1c;
    }

    .drawer-imgbox {
      width: 100%;
      aspect-ratio: 3/4;
      background: #1a1a1f;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;

    .drawer-imgbox img {

      transition: transform 0.3s;

    .drawer-category {

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ff1c1c;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    .drawer-title {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1.25;

    }

    .drawer-price-row {

      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    .drawer-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .drawer-orig-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #71717a;
      text-decoration: line-through;
    }

    .drawer-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: #a1a1aa;
      margin-bottom: 24px;
    }

    .drawer-actions {

      flex-direction: column;

    .btn-drawer-full {

      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;

      transition: all 0.2s;
    }

    .btn-drawer-full:hover {
      background: #ff1c1c;
      color: #ffffff;
      transform: translateY(-2px);
    }
  </style>
</head>

    const REAL_STORE_ITEMS = [

        pos: new THREE.Vector3(2.82, 0.82, -4.0),

      },
      {

        title: "Born To Win Heavyweight Studio Hoodie",

        desc: "Charming beige cotton corduroy dungaree overalls with adjustable shoulder buckles and cute teddy patch.",
        pngImg: "showroom_assets/user_hiphop_cutouts/hiphop_black_hoodie_hung.png",
        pos: new THREE.Vector3(2.82, 0.82, -5.4),
        w: 0.90, h: 1.30, isBeacon: false
      },
      {
        id: "right-hang-10",
        title: "Letterman 'B' Leather-Sleeve Varsity Jacket",
        category: "JACKETS",
        price: "₹2,799",
        originalPrice: "₹4,199",
        desc: "Premium scarlet red and midnight navy snap-button letterman jacket with chenille 'B' embroidery.",
        pngImg: "showroom_assets/user_hiphop_cutouts/hiphop_varsity_jacket_hung.png",
        pos: new THREE.Vector3(2.82, 0.82, -6.8),
        w: 0.95, h: 1.25, isBeacon: true
      },

      // CENTER TABLE: Folded Display Clothes
      {
        id: "table-item-1",
        title: "Amber Harvest Streetwear Knits & Folded Tees",
        category: "TABLE SELECTION",
        price: "₹1,899",
        originalPrice: "₹2,799",
        desc: "As seen on the center showroom table: Vibrant contrast streetwear apparel stack.",
        pngImg: "showroom_assets/user_real_pngs/real_grey_sweater.png",
        pos: new THREE.Vector3(-0.6, 0.46, -7.0),
        w: 1.0, h: 1.0, isBeacon: true
      }
    ];

    // -------------------------------------------------------------
    // 2. THREE.JS SCENE SETUP
    // -------------------------------------------------------------
    const canvas = document.getElementById('webglCanvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c0c10);
    scene.fog = new THREE.FogExp2(0x0c0c10, 0.022);

    const camera = new THREE.PerspectiveCamera(66, window.innerWidth / window.innerHeight, 0.05, 150);
    camera.position.set(0, 1.55, 3.2);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: "high-performance",
      precision: "mediump"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.98;
    renderer.shadowMap.enabled = false;

    // -------------------------------------------------------------
    // 3. ARCHITECTURAL LIGHTING & CEILING HEXAGON HONEYCOMB LIGHTS
    // -------------------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.52);
    scene.add(ambientLight);

    // Fill lights ensuring 360-degree viewing is never pitch-black
    const ambientHemi = new THREE.HemisphereLight(0x282832, 0x141418, 0.9);
    scene.add(ambientHemi);

    // Warm spotlights focused on clothing racks
    const spotLeftUpper = new THREE.SpotLight(0xffefe0, 2.8, 14, Math.PI / 4, 0.38);
    spotLeftUpper.position.set(-1.0, 3.4, -4.5);
    spotLeftUpper.target.position.set(-2.82, 2.0, -4.5);
    scene.add(spotLeftUpper);
    scene.add(spotLeftUpper.target);

    const spotRight = new THREE.SpotLight(0xffefe0, 2.5, 14, Math.PI / 4, 0.38);
    spotRight.position.set(1.0, 3.4, -5.0);
    spotRight.target.position.set(2.82, 1.5, -5.0);
    scene.add(spotRight);
    scene.add(spotRight.target);

    const spotCenterTable = new THREE.PointLight(0xffffff, 2.0, 9);
    spotCenterTable.position.set(-0.6, 2.8, -7.0);
    scene.add(spotCenterTable);

    // Hexagonal Honeycomb LED Ceiling Light Fixture (From Client Video Image)
    const hexGroup = new THREE.Group();
    const hexMat = new THREE.MeshBasicMaterial({ color: 0xdedede });
    function createHexRing(radius, y, z) {
      const hexGeo = new THREE.RingGeometry(radius - 0.04, radius, 6);
      const hex = new THREE.Mesh(hexGeo, hexMat);
      hex.rotation.x = Math.PI / 2;
      hex.position.set(0, y, z);
      hexGroup.add(hex);
    }
    createHexRing(0.9, 3.48, -2.5);
    createHexRing(0.9, 3.48, -4.5);
    createHexRing(0.9, 3.48, -6.5);
    createHexRing(0.9, 3.48, -8.5);
    scene.add(hexGroup);

    // -------------------------------------------------------------
    // 4. ARCHITECTURAL ROOM (Exact Real Shop Textures)
    // -------------------------------------------------------------
    const texLoader = new THREE.TextureLoader();

    // 1. Sleek Dark Luxury Boutique Tile Floor
    function createShopTileTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');
      // Dark slate background
      ctx.fillStyle = '#111116';
      ctx.fillRect(0, 0, 1024, 1024);

      const tileSize = 256;
      for (let x = 0; x < 1024; x += tileSize) {
        for (let y = 0; y < 1024; y += tileSize) {
          // Subtle deep border
          ctx.strokeStyle = '#08080a';
          ctx.lineWidth = 4;
          ctx.strokeRect(x + 4, y + 4, tileSize - 8, tileSize - 8);

          // Matte dark charcoal tile inner
          ctx.fillStyle = '#16161c';
          ctx.fillRect(x + 8, y + 8, tileSize - 16, tileSize - 16);
          
          // Delicate inner accent ring
          ctx.strokeStyle = '#22222b';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 18, y + 18, tileSize - 36, tileSize - 36);
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 8);
      return tex;
    }

    const floorGeo = new THREE.PlaneGeometry(16, 40);
    const floorMat = new THREE.MeshStandardMaterial({
      map: createShopTileTexture(),
      roughness: 0.35,
      metalness: 0.15
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, -0.6, -9);
    scene.add(floor);

    // 2. Ceiling
    const ceilGeo = new THREE.PlaneGeometry(16, 40);
    const ceilMat = new THREE.MeshStandardMaterial({
      color: 0x111116,
      roughness: 0.9
    });
    const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, 3.5, -9);
    scene.add(ceiling);

    // 3. Left Wall (Dark Boutique Concrete)
    const leftWallMat = new THREE.MeshStandardMaterial({
      color: 0x141418,
      roughness: 0.8,
      side: THREE.DoubleSide
    });
    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 4.5), leftWallMat);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.position.set(-4.5, 1.5, -9);
    scene.add(leftWall);

    // 4. Right Wall (Identical to Left Wall: Dark Boutique Concrete)
    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 4.5), leftWallMat);
    rightWall.rotation.y = -Math.PI / 2;
    rightWall.position.set(4.5, 1.5, -9);
    scene.add(rightWall);

    // 5. Entrance wall behind user
    const entranceMat = new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 0.8, side: THREE.DoubleSide });
    const entranceWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 4.5), entranceMat);
    entranceWall.rotation.y = Math.PI;
    entranceWall.position.set(0, 1.5, 6.0);
    scene.add(entranceWall);

    // 6. Complete Solid Back Room Wall (Closing all corner gaps behind the wardrobe)
    const backRoomWallMat = new THREE.MeshStandardMaterial({ color: 0x101014, roughness: 0.9, side: THREE.DoubleSide });
    const backRoomWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 4.5), backRoomWallMat);
    backRoomWall.position.set(0, 1.5, -15.8);
    scene.add(backRoomWall);

    // -------------------------------------------------------------
    // 5. LEFT SIDE: 2-TIER CLOTHES HANGING SLABS (Upper line & Lower line)
    // -------------------------------------------------------------
    const slabMat = new THREE.MeshStandardMaterial({
      color: 0x151518,
      metalness: 0.85,
      roughness: 0.25
    });

    // Left side upperPipe and lowerPipe removed per request

    const rightPipeUpper = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 11, 16), slabMat);
    rightPipeUpper.rotation.x = Math.PI / 2;
    rightPipeUpper.position.set(3.10, 2.80, -4.5);
    scene.add(rightPipeUpper);

    const rightPipeLower = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 11, 16), slabMat);
    rightPipeLower.rotation.x = Math.PI / 2;
    rightPipeLower.position.set(3.10, 1.30, -4.5);
    scene.add(rightPipeLower);

    for (let z of [-1.0, -3.5, -6.0, -8.5]) {
      const bRight = new THREE.Mesh(new THREE.BoxGeometry(1.68, 0.04, 0.04), slabMat);
      bRight.position.set(3.66, 2.15, z);
      scene.add(bRight);
    }

    // Optimized shared-geometry background hooks
    const sharedHookGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.12, 6);
    const sharedHookMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.3 });
    for (let z = -0.8; z >= -8.8; z -= 0.35) {
      const hookTop = new THREE.Mesh(sharedHookGeo, sharedHookMat);
      hookTop.position.set(-3.10, 2.79, z);
      scene.add(hookTop);

      const hookBot = new THREE.Mesh(sharedHookGeo, sharedHookMat);
      hookBot.position.set(-3.10, 1.59, z);
      scene.add(hookBot);
    }

    // -------------------------------------------------------------
    // 6. CENTER AISLE: FRONT BLACK METAL DISPLAY TABLE (With Folded Clothes)
    // -------------------------------------------------------------
    const tableGroup = new THREE.Group();

    const tableTopMat = new THREE.MeshStandardMaterial({ color: 0x18181c, roughness: 0.4, metalness: 0.5 });
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.06, 1.4), tableTopMat);
    tableTop.position.set(-0.6, 0.25, -7.0);
    tableGroup.add(tableTop);

    const legGeo = new THREE.BoxGeometry(0.05, 0.8, 0.05);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.3 });
    const legPositions = [
      [-1.7, -0.15, -7.6],
      [0.5, -0.15, -7.6],
      [-1.7, -0.15, -6.4],
      [0.5, -0.15, -6.4]
    ];
    legPositions.forEach(([x, y, z]) => {
      const leg = new THREE.Mesh(legGeo, legMat);
      leg.position.set(x, y, z);
      tableGroup.add(leg);
    });

    const orangeTee = new THREE.Mesh(
      new THREE.BoxGeometry(0.65, 0.08, 0.55),
      new THREE.MeshStandardMaterial({ color: 0xe65c00, roughness: 0.6 })
    );
    orangeTee.position.set(-0.9, 0.32, -7.0);
    tableGroup.add(orangeTee);

    const blackStack = new THREE.Mesh(
      new THREE.BoxGeometry(0.75, 0.14, 0.65),
      new THREE.MeshStandardMaterial({ color: 0x1c1c20, roughness: 0.7 })
    );
    blackStack.position.set(-0.2, 0.35, -7.0);
    tableGroup.add(blackStack);

    const whiteStack = new THREE.Mesh(
      new THREE.BoxGeometry(0.65, 0.10, 0.55),
      new THREE.MeshStandardMaterial({ color: 0xf0f0f4, roughness: 0.6 })
    );
    whiteStack.position.set(-0.9, 0.40, -7.0);
    tableGroup.add(whiteStack);

    scene.add(tableGroup);

    // -------------------------------------------------------------
    // 7. BACK WALL: WARDROBE CABINETS & ILLUMINATED SHELVES (Matching Photo)
    // -------------------------------------------------------------
    const wardrobeGroup = new THREE.Group();

    const wardrobeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1f, roughness: 0.5, side: THREE.DoubleSide });
    const wardrobeBack = new THREE.Mesh(new THREE.BoxGeometry(7.2, 3.8, 0.6), wardrobeMat);
    wardrobeBack.position.set(0, 1.5, -15.2);
    wardrobeGroup.add(wardrobeBack);

    for (let shelfY of [0.6, 1.3, 2.0, 2.7]) {
      const shelfPlank = new THREE.Mesh(
        new THREE.BoxGeometry(6.8, 0.05, 0.55),
        new THREE.MeshStandardMaterial({ color: 0x24242a, roughness: 0.4 })
      );
      shelfPlank.position.set(0, shelfY, -14.9);
      wardrobeGroup.add(shelfPlank);

      for (let stackX of [-2.6, -1.8, -1.0, -0.2, 0.6, 1.4, 2.2]) {
        const stackColor = (stackX < 0) ? 0x2b3e50 : 0x1a1a1c;
        const foldedStack = new THREE.Mesh(
          new THREE.BoxGeometry(0.65, 0.16, 0.45),
          new THREE.MeshStandardMaterial({ color: stackColor, roughness: 0.65 })
        );
        foldedStack.position.set(stackX, shelfY + 0.10, -14.9);
        wardrobeGroup.add(foldedStack);
      }
    }

    const wardrobeLight = new THREE.PointLight(0xffeedd, 2.2, 7);
    wardrobeLight.position.set(0, 2.8, -14.6);
    wardrobeGroup.add(wardrobeLight);

    scene.add(wardrobeGroup);

    // -------------------------------------------------------------
    // 8. RIGHT SIDE: RACKS & SHELVES WITH FOLDED CLOTHES
    // -------------------------------------------------------------
    // Right side pedestals/boxes completely removed as requested
    const rightRacksGroup = new THREE.Group();
    scene.add(rightRacksGroup);

    // -------------------------------------------------------------
    // 9. DENSE MULTI-CLOTHES HANGING SYSTEM (Physical Hangers & Sway)
    // -------------------------------------------------------------
    const garmentMeshes = [];
    const hotspotsContainer = document.getElementById('hotspotsContainer');

    REAL_STORE_ITEMS.forEach((item, idx) => {
      const itemTex = texLoader.load(item.pngImg);
      itemTex.encoding = THREE.sRGBEncoding;

      // Garment sizing: Enlarged for right-wall display to look prominent and bold
      let scaleMultiplier = item.id.includes('table') ? 1.0 : 0.82;
      if (item.id.includes('right-hang')) {
        scaleMultiplier = 1.05; // Balanced large size without overlap
      }
      const w = (item.w || 1.05) * scaleMultiplier;
      const h = (item.h || 1.45) * scaleMultiplier;

      const geo = new THREE.PlaneGeometry(w, h);
      const mat = new THREE.MeshStandardMaterial({
        map: itemTex,
        transparent: true,
        alphaTest: 0.05,
        roughness: 0.45,
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(item.pos);
      // Give more clearance from the center walkway
      if (mesh.position.x < -1) {
        mesh.position.x = -3.10;
      } else if (mesh.position.x > 1) {
        mesh.position.x = 3.10;
      }

      // Angled naturally along the rack (creating realistic boutique rack depth)
      if (item.pos.x < -1) {
        mesh.rotation.y = Math.PI / 2 + (Math.sin(idx) * 0.12);
      } else if (item.pos.x > 1) {
        mesh.rotation.y = -Math.PI / 2 + (Math.sin(idx) * 0.12);
      } else {
        mesh.rotation.y = 0;
      }

      mesh.userData = { ...item, idx: idx };
      scene.add(mesh);
      garmentMeshes.push(mesh);

      // Realistic 3D Hanger Top Hook connecting garment to pipe
      let hangerTopY = 2.85;
      if (item.id.includes('hang-bot')) hangerTopY = 1.65;
      else if (item.id.includes('right-hang')) {
        hangerTopY = (item.pos.y > 1.8) ? 2.80 : 1.80;
      }
      else if (item.id.includes('table')) hangerTopY = item.pos.y + 0.6;

      const hookHeight = Math.abs(hangerTopY - (item.pos.y + h / 2));
      const hookMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.007, 0.007, hookHeight + 0.06, 12),
        new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.9, roughness: 0.2 })
      );
      const targetX = mesh.position.x;
      hookMesh.position.set(targetX, hangerTopY - (hookHeight / 2), item.pos.z);
      scene.add(hookMesh);

      // Wooden Hanger Bar removed across entire showroom per request

      // Pulsing Spotlight Hotspot Beacon for featured items
      if (item.isBeacon) {
        const beacon = document.createElement('div');
        beacon.className = 'spotlight-beacon';
        beacon.id = `beacon-${idx}`;
        beacon.innerHTML = `
          <div class="spotlight-beacon-pulse"></div>
          <div class="spotlight-beacon-dot"></div>
          <div class="spotlight-tag-label">
            <span>${item.title.split(' ')[0]} ${item.title.split(' ')[1] || ''}</span>
            <span style="color: #ff4d4d; font-weight: 700;">${item.price}</span>
          </div>
        `;

        beacon.addEventListener('click', (e) => {
          e.stopPropagation();
          openProductDrawer(item);
        });

        hotspotsContainer.appendChild(beacon);
        item.beaconEl = beacon;
      }
    });

    // -------------------------------------------------------------
    // 10. SMOOTH AISLE TRAVERSAL & 360-DEGREE MOUSE CAMERA ENGINE
    // -------------------------------------------------------------
    let currentProgress = 0;
    let targetProgress = 0;

    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let targetYaw = 0;
    let targetPitch = 0;
    let currentYaw = 0;
    let currentPitch = 0;

    // Track scroll events on mouse wheel with smooth boundaries
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      // Smooth and responsive walk forward/backward with mouse wheel
      const delta = e.deltaY * 0.0012;
      targetProgress = THREE.MathUtils.clamp(targetProgress + delta, 0, 1);
    }, { passive: false });

    // Keyboard navigation (Arrow keys & W/S keys)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        targetProgress = THREE.MathUtils.clamp(targetProgress + 0.05, 0, 1);
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        targetProgress = THREE.MathUtils.clamp(targetProgress - 0.05, 0, 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        targetYaw += 0.08;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        targetYaw -= 0.08;
      }
    });

    // Ultra-fluid 1:1 Pointer 360-degree look controls
    const onPointerDown = (e) => {
      isDragging = true;
      const pt = e.touches ? e.touches[0] : e;
      prevMouseX = pt.clientX;
      prevMouseY = pt.clientY;
    };

    const onPointerMove = (e) => {
      if (!isDragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const deltaX = pt.clientX - prevMouseX;
      const deltaY = pt.clientY - prevMouseY;

      targetYaw -= deltaX * 0.0035;
      targetPitch -= deltaY * 0.0030;
      targetPitch = THREE.MathUtils.clamp(targetPitch, -Math.PI / 2.8, Math.PI / 2.8);

      prevMouseX = pt.clientX;
      prevMouseY = pt.clientY;
    };

    const onPointerUp = () => {
      isDragging = false;
    };

    window.addEventListener('mousedown', onPointerDown, { passive: false });
    window.addEventListener('mousemove', onPointerMove, { passive: false });
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Raycaster for clicking directly on 3D clothes meshes
    const raycaster = new THREE.Raycaster();
    const mousePos = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if (e.target.closest('.product-drawer') || e.target.closest('.hud-top-bar') || e.target.closest('.spotlight-beacon')) {
        return;
      }

      mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
      mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mousePos, camera);
      const intersects = raycaster.intersectObjects(garmentMeshes);

      if (intersects.length > 0) {
        const clickedGarment = intersects[0].object.userData;
        openProductDrawer(clickedGarment);
      }
    });

    // -------------------------------------------------------------
    // 11. PRODUCT DRAWER
    // -------------------------------------------------------------
    const productDrawer = document.getElementById('productDrawer');
    const drawerImg = document.getElementById('drawerImg');
    const drawerCategory = document.getElementById('drawerCategory');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerPrice = document.getElementById('drawerPrice');
    const drawerOrigPrice = document.getElementById('drawerOrigPrice');
    const drawerDesc = document.getElementById('drawerDesc');
    const drawerDetailLink = document.getElementById('drawerDetailLink');

    function openProductDrawer(item) {
      drawerImg.src = item.pngImg;
      drawerCategory.innerText = item.category;
      drawerTitle.innerText = item.title;
      drawerPrice.innerText = item.price;
      drawerOrigPrice.innerText = item.originalPrice;
      drawerDesc.innerText = item.desc;
      drawerDetailLink.href = `product_detail.html?id=${item.id}`;

      productDrawer.classList.add('open');

      const toGarment = new THREE.Vector3().subVectors(item.pos, camera.position);
      targetYaw = Math.atan2(-toGarment.x, -toGarment.z);
    }

    function closeProductDrawer() {
      productDrawer.classList.remove('open');
    }

    // -------------------------------------------------------------
    // 12. ANIMATION LOOP & HOTSPOT PROJECTION
    // -------------------------------------------------------------
    const clock = new THREE.Clock();
    const tempVec = new THREE.Vector3();

    const lookDir = new THREE.Vector3();
    const lookTarget = new THREE.Vector3();
    const camFwd = new THREE.Vector3();
    const toItem = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      // 60FPS fluid camera walk interpolation
      currentProgress += (targetProgress - currentProgress) * 0.12;
      camera.position.z = 2.2 + (-12.5 - 2.2) * currentProgress;
      camera.position.x = 0;
      camera.position.y = 1.55;

      // 60FPS fluid look angle interpolation
      currentYaw += (targetYaw - currentYaw) * 0.14;
      currentPitch += (targetPitch - currentPitch) * 0.14;

      const cosP = Math.cos(currentPitch);
      lookDir.set(
        -Math.sin(currentYaw) * cosP,
        Math.sin(currentPitch),
        -Math.cos(currentYaw) * cosP
      );

      lookTarget.copy(camera.position).add(lookDir);
      camera.lookAt(lookTarget);

      // Subtle organic sway
      const time = clock.getElapsedTime();
      for (let i = 0; i < garmentMeshes.length; i++) {
        garmentMeshes[i].rotation.z = Math.sin(time * 1.5 + i * 0.7) * 0.012;
      }

      // Hardware-accelerated GPU translate3d beacon positioning (Zero CSS Reflows)
      camera.getWorldDirection(camFwd);
      const halfW = window.innerWidth * 0.5;
      const halfH = window.innerHeight * 0.5;

      for (let i = 0; i < REAL_STORE_ITEMS.length; i++) {
        const item = REAL_STORE_ITEMS[i];
        if (!item.beaconEl) continue;

        toItem.subVectors(item.pos, camera.position);
        const dist = toItem.length();
        const dot = toItem.normalize().dot(camFwd);

        if (dot <= 0.35 || dist > 10.5 || dist < 0.6) {
          if (item.beaconEl.style.display !== 'none') item.beaconEl.style.display = 'none';
          continue;
        }

        tempVec.copy(item.pos).project(camera);

        if (tempVec.z > 1 || tempVec.x < -1.1 || tempVec.x > 1.1 || tempVec.y < -1.1 || tempVec.y > 1.1) {
          if (item.beaconEl.style.display !== 'none') item.beaconEl.style.display = 'none';
        } else {
          if (item.beaconEl.style.display !== 'flex') item.beaconEl.style.display = 'flex';
          const screenX = (tempVec.x * halfW + halfW);
          const screenY = (-tempVec.y * halfH + halfH);
          const scale = THREE.MathUtils.clamp(1.15 - dist * 0.065, 0.65, 1.15);

          // Using 3D transform with GPU acceleration (bypasses layout/repaint passes)
          item.beaconEl.style.transform = `translate3d(${screenX}px, ${screenY}px, 0) translate(-50%, -50%) scale(${scale})`;
          item.beaconEl.style.opacity = `${THREE.MathUtils.clamp(1.4 - dist * 0.09, 0.2, 1.0)}`;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // Responsive resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
